version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hiking-db
    environment:
      POSTGRES_USER: hiking
      POSTGRES_PASSWORD: hiking123
      POSTGRES_DB: hiking_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hiking-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
